<!DOCTYPE html>
<html lang="ja">
  <head><meta charset="UTF-8"><title>vapor (SSR)</title></head>
  <!-- ssr-outlet と ssr-teleports は scripts/prerender.mjs がビルド後に置換する。
       置換されないまま preview されると #app が空になり、hydration ではなく
       通常のクライアント描画になってしまうため、prerender 側で検査している。

       ssr-teleports が body の**先頭**にあるのは、Vue の Teleport が hydration
       時に移動先の firstChild からマーカーを探すため。ここより前に要素を置くと、
       その要素が Teleport の中身として取り込まれて消える。 -->
  <body><!--ssr-teleports--><div id="app"><!--ssr-outlet--></div><script type="module" src="/src/main-ssr.js"></script></body>
</html>
